---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Backs up the volume of the CloudNativePG cluster ${APP}-postgres (one instance)
# to Hypnos. CloudNativePG creates the PVC itself, so unlike ../backup this
# component has no PVC or Restore; restore by hand into a new cluster.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./snapshotpolicy.yaml
  - ./snapshotschedule.yaml
