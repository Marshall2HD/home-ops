---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Continuous WAL archiving plus a nightly base backup of the CloudNativePG
# cluster ${APP}-postgres to Garage on Hypnos (bucket cnpg), through the
# Barman Cloud plugin. The Cluster opts in with spec.plugins; see
# ./README.md for restore.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./externalsecret.yaml
  - ./objectstore.yaml
  - ./scheduledbackup.yaml
