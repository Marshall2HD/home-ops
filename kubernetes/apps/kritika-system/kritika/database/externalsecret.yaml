---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .password }}"
        uri: "postgres://kritika:{{ .password }}@kritika-postgres-rw:5432/kritika?sslmode=require&connect_timeout=10"
  data:
    - secretKey: password
      remoteRef:
        key: xxx-kritika-postgres
        property: password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .password }}"
        uri: "postgres://kritika_app:{{ .password }}@kritika-postgres-rw:5432/kritika?sslmode=require&connect_timeout=10"
  data:
    - secretKey: password
      remoteRef:
        key: xxx-kritika-postgres
        property: app-password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-runner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_runner
        password: "{{ .password }}"
        uri: "postgres://kritika_runner:{{ .password }}@kritika-postgres-rw:5432/kritika?sslmode=require&connect_timeout=10"
  data:
    - secretKey: password
      remoteRef:
        key: xxx-kritika-postgres
        property: runner-password
