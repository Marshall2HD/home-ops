---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-secret
  data:
    - secretKey: KRITIKA_AUTH_ADMIN_PASSWORD
      remoteRef:
        key: xxx-kritika
        property: password
    - secretKey: KRITIKA_METAXU_API_KEY
      remoteRef:
        key: xxx-metaxu
        property: kritika
    - secretKey: KRITIKA_GITHUB_CLIENT_ID
      remoteRef:
        key: xxx-heph-bot
        property: username
    - secretKey: KRITIKA_GITHUB_PRIVATE_KEY
      remoteRef:
        key: xxx-heph-bot
        property: file/private-key.pem
    - secretKey: KRITIKA_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: xxx-heph-bot
        property: webhook-secret
