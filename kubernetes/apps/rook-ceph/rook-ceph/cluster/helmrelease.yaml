---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  labels:
    # Keep the cluster-wide remediation patch from re-enabling engine rollback.
    helm.hades.casa/upgrade-strategy: retry
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  timeout: 15m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    cephImage:
      # Includes the ceph-volume fix for nonexistent devices during raw discovery.
      repository: quay.io/ceph/ceph
      tag: v21.2.0
    cephClusterSpec:
      cephConfig:
        global:
          mon_data_avail_warn: "15"
          osd_pool_default_size: "2"
          osd_pool_default_min_size: "1"
          # Never mark OSDs out when the whole host is down (a reboot of the one node).
          mon_osd_down_out_subtree_limit: host
      mon:
        count: 1 # Single Node
        allowMultiplePerNode: false
      cleanupPolicy:
        # Nyx only uses the two explicitly selected disks; never sanitize other disks.
        wipeDevicesFromOtherClusters: false
      crashCollector:
        disable: false
      # Two OSDs: Rook skips ok-to-stop below three OSDs and restarts them back to back.
      # Restarting the second before the first has caught up leaves PGs down, and the
      # raw-mode OSD activate then hangs in lvs on an RBD device (2026-10-14). Wait for
      # active+clean before each OSD update.
      upgradeOSDRequiresHealthyPGs: true
      disruptionManagement:
        # Single node: Rook's OSD/MDS/mon PDBs cannot be satisfied during a node drain
        # and made Talos wait forever (Aug 2026). See kubernetes/REBOOT.md.
        managePodBudgets: false
      csi:
        cephfs:
          kernelMountOptions: ms_mode=prefer-crc
        readAffinity:
          enabled: false # https://github.com/ceph/ceph-csi/issues/5772
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.o11y.svc.cluster.local:9090
      healthCheck:
        # Until the first reboot after the CSI rotation: existing CSI mounts keep the prior
        # aes key, and allowedCiphers can only be restricted once nothing uses aes. Then drop
        # these mutes (kubernetes/REBOOT.md, last section).
        muteHealthWarning:
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      mgr:
        count: 1 # Single Node
        modules:
          - name: pg_autoscaler
            enabled: true
      network:
        connections:
          requireMsgr2: true
      resources:
        osd:
          limits:
            memory: 8Gi # Required for bootstrap
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keepPriorKeyCountMax: 1 # existing mounts keep the aes key until Nyx reboots
            keyType: aes256k # Talos 1.14 kernels (6.18.48) carry the aes256k backport
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
      storage:
        useAllDevices: false
        devicePathFilter: "^/dev/disk/by-id/nvme-Micron_7450_MTFDKBA800TFS_(25124FA456CD|25124FA45676)$"
        config:
          osdsPerDevice: "1"
        useAllNodes: true
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.hades.casa
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: osd # Changed from 'host' for single node
          replicated:
            size: 2 # Mirror across 2 drives
        storageClass:
          enabled: true
          name: ceph-block
          allowVolumeExpansion: true
          isDefault: true
          mountOptions:
            - discard
          parameters:
            compression_algorithm: zstd
            compression_mode: passive
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            imageFeatures: deep-flatten,exclusive-lock,fast-diff,layering,object-map
            imageFormat: "2"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      deletionPolicy: Delete
      isDefault: true
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            failureDomain: osd
            replicated:
              size: 2
          dataPools:
            - name: data0
              failureDomain: osd
              replicated:
                size: 2
          metadataServer:
            activeCount: 1
            activeStandby: true
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: ceph-filesystem
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          name: ceph-filesystem
          allowVolumeExpansion: true
          isDefault: false
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          pool: data0
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      deletionPolicy: Delete
      isDefault: false
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          defaultRealm: true
          metadataPool:
            failureDomain: osd # Single node
            replicated:
              size: 2 # Mirror across 2 drives
          dataPool:
            failureDomain: osd
            replicated:
              size: 2
            quotas:
              maxSize: 100Gi
          preservePoolsOnDelete: true
          gateway:
            port: 80
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            instances: 1 # Single node
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          name: ceph-bucket
