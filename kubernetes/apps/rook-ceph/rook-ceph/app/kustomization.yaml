---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ceph-csi-drivers.yaml
  - ./ceph-csi-profiles.yaml
  - ./ocirepository.yaml

# First migration stage: protect the old inventory before Helm takes sole ownership.
# Keep the generated resources until this annotation has reconciled on Nyx.
patches:
  - target:
      name: '(rook-ceph-(cephfs|rbd)-csi-ceph-com-.*|rook-ceph\.(cephfs|rbd)\.csi\.ceph\.com|ceph-csi-operator-config)'
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
