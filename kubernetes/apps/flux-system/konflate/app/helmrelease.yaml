---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://Marshall2HD/home-ops
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.hades.casa
      mcp: true
      verifyImages: true
      # This instance renders for Nyx, not the Kubernetes version bundled in Helm.
      kubeVersion: "{{ .Capabilities.KubeVersion.Version }}"
      helmApiVersions: '{{ join "," .Capabilities.APIVersions }}'
      extraEnv:
        - name: DOCKER_CONFIG
          value: /var/run/registry
        - name: FLATE_REGISTRY_CONFIG
          value: /var/run/registry/config.json
    secret:
      existingSecret: konflate-webhook-token-secret
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    volumes:
      - name: registry-auth
        secret:
          secretName: konflate-registry-secret
          items:
            - key: .dockerconfigjson
              path: config.json
    volumeMounts:
      - name: registry-auth
        mountPath: /var/run/registry
        readOnly: true
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.hades.casa"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
