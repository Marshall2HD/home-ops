---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-webhook-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: konflate-webhook-token-secret
    template:
      data:
        # Derive a separate endpoint secret without introducing a new vault item.
        KONFLATE_WEBHOOK_SECRET: '{{ printf "konflate:%s" .webhookToken | sha256sum }}'
        KONFLATE_APP_CLIENT_ID: "{{ .appClientId }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .appPrivateKey }}"
  data:
    - secretKey: appClientId
      remoteRef:
        key: github-bot
        property: GITHUB_BOT_APP_CLIENT_ID
    - secretKey: appPrivateKey
      remoteRef:
        key: github-bot
        property: file/GITHUB_BOT_APP_PRIVATE_KEY
    - secretKey: webhookToken
      remoteRef:
        key: flux
        property: FLUX_GITHUB_WEBHOOK_TOKEN
