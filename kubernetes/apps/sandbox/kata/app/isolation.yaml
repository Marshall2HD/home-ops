---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
# No DNS, internet, cluster or LAN access until explicitly granted for a workload.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox
spec:
  hard:
    pods: "4"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.ephemeral-storage: 8Gi
    limits.ephemeral-storage: 8Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 256Mi
      default:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 2Gi
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandbox-kata
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: sandbox
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
        scope: Namespaced
  validations:
    - expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'kata'
      message: Sandbox pods must use runtimeClassName kata; there is no runc fallback.
    - expression: has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: Sandbox pods must explicitly disable service account token mounting.
    - expression: '!has(object.spec.serviceAccountName) || object.spec.serviceAccountName == "default"'
      message: Sandbox pods must use the unprivileged default service account.
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected) || v.projected.sources.all(s, !has(s.serviceAccountToken)))"
      message: Sandbox pods cannot explicitly project service account tokens.
    - expression: '!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith("io.katacontainers.") && k != "k8s.v1.cni.cncf.io/networks")'
      message: Sandbox pods cannot override Kata configuration or attach additional networks.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandbox-kata
spec:
  policyName: sandbox-kata
  validationActions: [Deny]
