---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proto
spec:
  chartRef:
    kind: OCIRepository
    name: proto
  interval: 1h
  values:
    controllers:
      proto:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/marshall2hd/proto
              tag: rewrite-cleanroom@sha256:7c5405ac093e392f8866e3ca4035a48f7380c669eb2ef091790234c4dc2161bf
            env:
              ELEVENLABS_VOICE_ID: G2Dg8KOxjwR9pkW7Prmp
              # yt-dlp writes its cache under HOME; the root filesystem is read-only.
              HOME: /tmp
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
