---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/eleboucher/memini
            env:
              # Our distilled voyage-4-nano on the L4 (the `embedding` app), 2026-10-31; was voyage-4-large through Metaxu.
              # It needs its prompts on both sides; a model change re-embeds the store at startup (74 memories).
              MEMINI_EMBED_BASE_URL: http://embedding.default.svc.cluster.local:8000/v1
              MEMINI_EMBED_MODEL: voyage-4-nano-distill
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_API_KEY: unused
              MEMINI_EMBED_QUERY_PREFIX: "Represent the query for retrieving supporting documents: "
              MEMINI_EMBED_DOC_PREFIX: "Represent the document for retrieval: "
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"
              # The sqlite store scores vectors as 1/(1+L2), which for unit vectors never goes below 0.414.
              # voyage-4-large needed 0.443 (2026-10-26: own "what is X" queries >= 0.4455, unrelated <= 0.4407).
              # Over all pairs of this store's memories our model's cosine runs ~0.06 higher (corr 0.95), which maps
              # 0.4407 / 0.443 / 0.4455 to 0.4525 / 0.454 / 0.457.
              MEMINI_RECALL_MIN_SEMANTIC_SCORE: "0.454"
              MEMINI_CLIENT_DEFAULTS: '{"namespace_scope":"owner_tree"}'
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      # metaxu.falkerie.com resolves to Thanatos's tailnet address on the LAN, which pods can't reach
      hostAliases:
        - ip: 10.4.0.178
          hostnames: [metaxu.falkerie.com]
    route:
      main:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}.hades.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: ui
      mcp:
        hostnames:
          - "{{ .Release.Name }}.hades.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: http
            matches:
              - path:
                  value: /mcp
              - path:
                  value: /v1
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
    prometheusRule:
      enabled: true
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir
