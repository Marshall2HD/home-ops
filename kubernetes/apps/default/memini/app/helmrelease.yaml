---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/eleboucher/memini
            env:
              # Voyage through Metaxu's /v1/embeddings: memini sends `encoding_format: float`,
              # which api.voyageai.com rejects
              MEMINI_EMBED_BASE_URL: https://metaxu.falkerie.com/v1
              MEMINI_EMBED_MODEL: voyage-4-large
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_CLIENT_DEFAULTS: '{"namespace_scope":"owner_tree"}'
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      # metaxu.falkerie.com resolves to Thanatos's tailnet address on the LAN, which pods can't reach
      hostAliases:
        - ip: 10.4.0.178
          hostnames: [metaxu.falkerie.com]
    route:
      main:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}.hades.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: ui
      mcp:
        hostnames:
          - "{{ .Release.Name }}.hades.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: http
            matches:
              - path:
                  value: /mcp
              - path:
                  value: /v1
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
    prometheusRule:
      enabled: true
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir
