---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cobalt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cobalt-secret
  data:
    - secretKey: TURNSTILE_SITEKEY
      remoteRef:
        key: xxx-cloudflare-turnstile
        property: cobalt-site-key
    - secretKey: TURNSTILE_SECRET
      remoteRef:
        key: xxx-cloudflare-turnstile
        property: cobalt-secret-key
    - secretKey: JWT_SECRET
      remoteRef:
        key: xxx-cobalt
        property: password
