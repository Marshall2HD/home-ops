---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-mcp-secret
  data:
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: unifi
        property: credential
    - secretKey: UNIFI_USERNAME
      remoteRef:
        key: unifi-mcp
        property: username
    - secretKey: UNIFI_PASSWORD
      remoteRef:
        key: unifi-mcp
        property: password
    - secretKey: UNIFI_MCP_HTTP_AUTH_TOKEN
      remoteRef:
        key: unifi-mcp
        property: bearer-token
