---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: langfuse-secret
  data:
    - secretKey: salt
      remoteRef:
        key: xxx-langfuse
        property: salt
    - secretKey: encryption-key
      remoteRef:
        key: xxx-langfuse
        property: encryption-key
    - secretKey: nextauth-secret
      remoteRef:
        key: xxx-langfuse
        property: nextauth-secret
    - secretKey: LANGFUSE_POSTGRES_PASSWORD
      remoteRef:
        key: xxx-langfuse-postgres
        property: password
    - secretKey: clickhouse-password
      remoteRef:
        key: xxx-langfuse
        property: clickhouse-password
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: xxx-langfuse
        property: valkey-password
