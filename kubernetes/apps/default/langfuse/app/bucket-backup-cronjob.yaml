---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-bucket-backup
spec:
  schedule: "0 4 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              image: docker.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              args:
                - sync
                - src:langfuse
                - dst:langfuse
                - --transfers=16
                - --checkers=32
                - --stats=60s
                - --stats-one-line
              env:
                - name: RCLONE_CONFIG
                  value: /dev/null
                - name: HOME
                  value: /tmp
                - name: XDG_CACHE_HOME
                  value: /tmp
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: s3
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: Ceph
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
                - name: RCLONE_CONFIG_SRC_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_SRC_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-bucket
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-bucket
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_DST_TYPE
                  value: s3
                - name: RCLONE_CONFIG_DST_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_DST_ENDPOINT
                  value: http://hypnos.internal:3900
                - name: RCLONE_CONFIG_DST_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_DST_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_DST_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_DST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-bucket-backup
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-bucket-backup
                      key: AWS_SECRET_ACCESS_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
