---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
spec:
  interval: 1h
  chart:
    spec:
      # renovate: registryUrl=https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      version: 2.1.1
      sourceRef:
        kind: HelmRepository
        name: langfuse-charts
      interval: 15m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: langfuse
    global:
      security:
        allowInsecureImages: true

    langfuse:
      deployment:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
      pod:
        annotations:
          reloader.stakater.com/auto: "true"
      logging:
        level: info
        format: text
      salt:
        secretKeyRef:
          name: langfuse-secret
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-secret
          key: encryption-key
      features:
        telemetryEnabled: false
        signUpDisabled: true
        experimentalFeaturesEnabled: false
      nextauth:
        url: https://langfuse.hades.casa
        secret:
          secretKeyRef:
            name: langfuse-secret
            key: nextauth-secret
      web:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        pdb:
          create: false
        livenessProbe:
          initialDelaySeconds: 60
          failureThreshold: 6
        readinessProbe:
          initialDelaySeconds: 30
          failureThreshold: 12
      worker:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        pdb:
          create: false
        livenessProbe:
          initialDelaySeconds: 60
          failureThreshold: 6

    postgresql:
      deploy: false
      host: postgres.database.svc.cluster.local
      port: 5432
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-secret
        secretKeys:
          adminPasswordKey: LANGFUSE_POSTGRES_PASSWORD
          userPasswordKey: LANGFUSE_POSTGRES_PASSWORD

    redis:
      deploy: false
      host: valkey.database.svc.cluster.local
      port: 6379
      auth:
        username: default
        existingSecret: langfuse-secret
        existingSecretPasswordKey: VALKEY_PASSWORD
        database: 0

    clickhouse:
      deploy: true
      logLevel: warning
      extraOverrides: |
        <clickhouse>
          <!-- Bound concurrent merges and row-block memory on Nyx. -->
          <background_pool_size>2</background_pool_size>
          <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
          <merge_tree>
            <merge_max_block_size>1024</merge_max_block_size>
            <number_of_free_entries_in_pool_to_lower_max_size_of_merge>1</number_of_free_entries_in_pool_to_lower_max_size_of_merge>
            <number_of_free_entries_in_pool_to_execute_mutation>2</number_of_free_entries_in_pool_to_execute_mutation>
            <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>3</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
          </merge_tree>
          <!-- Keep low-value system logs from competing with Langfuse data for
               memory and Ceph I/O. These logs are not used by Langfuse. -->
          <text_log remove="1"/>
          <query_log remove="1"/>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <trace_log remove="1"/>
          <part_log remove="1"/>
          <metric_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <latency_log remove="1"/>
          <error_log remove="1"/>
          <query_metric_log remove="1"/>
          <opentelemetry_span_log remove="1"/>
          <processors_profile_log remove="1"/>
          <asynchronous_insert_log remove="1"/>
        </clickhouse>
      usersExtraOverrides: |
        <clickhouse>
          <profiles>
            <default>
              <memory_profiler_step>0</memory_profiler_step>
              <memory_profiler_sample_probability>0</memory_profiler_sample_probability>
              <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
              <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
              <trace_profile_events>0</trace_profile_events>
            </default>
          </profiles>
        </clickhouse>
      clusterEnabled: false
      shards: 1
      replicaCount: 1
      auth:
        existingSecret: langfuse-secret
        existingSecretKey: clickhouse-password
      zookeeper:
        enabled: false
      # StatefulSet volumeClaimTemplates are immutable after install.
      # The existing ClickHouse PVC expansion is declared in pvc-clickhouse.yaml.
      persistence:
        storageClass: ceph-block
        size: 10Gi
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          memory: 8Gi

    s3:
      deploy: false
      bucket: langfuse
      region: auto
      endpoint: http://minio.database.svc.cluster.local:9000
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-secret
          key: MINIO_LANGFUSE_ACCESS_KEY
      secretAccessKey:
        secretKeyRef:
          name: langfuse-secret
          key: MINIO_LANGFUSE_SECRET_KEY
