---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cleanrr-secret
  data:
    - secretKey: CLEANRR_SERVERS__RADARR__API_KEY
      remoteRef:
        key: radarr
        property: credential
    - secretKey: CLEANRR_SERVERS__SONARR__API_KEY
      remoteRef:
        key: sonarr
        property: credential
