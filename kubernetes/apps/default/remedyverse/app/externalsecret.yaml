---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: remedyverse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: remedyverse-secret
    template:
      data:
        MEDIAWIKI_SECRET_KEY: "{{ .MEDIAWIKI_SECRET_KEY }}"
        MEDIAWIKI_UPGRADE_KEY: "{{ .MEDIAWIKI_UPGRADE_KEY }}"
        MEDIAWIKI_ADMIN_USER: "{{ .MEDIAWIKI_ADMIN_USER }}"
        MEDIAWIKI_ADMIN_PASSWORD: "{{ .MEDIAWIKI_ADMIN_PASSWORD }}"
        MEDIAWIKI_DB_PASSWORD: "{{ .REMEDYVERSE_POSTGRES_PASSWORD }}"
        PGPASSWORD: "{{ .REMEDYVERSE_POSTGRES_PASSWORD }}"
        TURNSTILE_SITE_KEY: "{{ .TURNSTILE_SITE_KEY }}"
        TURNSTILE_SECRET_KEY: "{{ .TURNSTILE_SECRET_KEY }}"
        R2_ACCESS_KEY_ID: "{{ .R2_ACCESS_KEY_ID }}"
        R2_SECRET_ACCESS_KEY: "{{ .R2_SECRET_ACCESS_KEY }}"
        R2_BUCKET: "{{ .R2_BUCKET }}"
        R2_ENDPOINT: "{{ .R2_ENDPOINT }}"
        R2_PUBLIC_DOMAIN: "{{ .R2_PUBLIC_DOMAIN }}"
  dataFrom:
    - extract:
        key: remedyverse
    - extract:
        key: postgres
