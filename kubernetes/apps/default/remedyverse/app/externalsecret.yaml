---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: remedyverse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: remedyverse-secret
  data:
    - secretKey: MEDIAWIKI_SECRET_KEY
      remoteRef:
        key: xxx-remedyverse
        property: secret-key
    - secretKey: MEDIAWIKI_UPGRADE_KEY
      remoteRef:
        key: xxx-remedyverse
        property: upgrade-key
    - secretKey: MEDIAWIKI_ADMIN_USER
      remoteRef:
        key: xxx-remedyverse
        property: username
    - secretKey: MEDIAWIKI_ADMIN_PASSWORD
      remoteRef:
        key: xxx-remedyverse
        property: password
    - secretKey: MEDIAWIKI_DB_PASSWORD
      remoteRef:
        key: xxx-remedyverse-postgres
        property: password
    - secretKey: PGPASSWORD
      remoteRef:
        key: xxx-remedyverse-postgres
        property: password
    - secretKey: TURNSTILE_SITE_KEY
      remoteRef:
        key: xxx-cloudflare-turnstile
        property: remedyverse-site-key
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef:
        key: xxx-cloudflare-turnstile
        property: remedyverse-secret-key
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: xxx-cloudflare-r2
        property: username
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: xxx-cloudflare-r2
        property: credential
    - secretKey: R2_BUCKET
      remoteRef:
        key: xxx-cloudflare-r2
        property: bucket
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: xxx-cloudflare-r2
        property: endpoint
    - secretKey: R2_PUBLIC_DOMAIN
      remoteRef:
        key: xxx-cloudflare-r2
        property: public-domain
