---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: open-webui-secret
    template:
      data:
        WEBUI_SECRET_KEY: "{{ .secret_key }}"
        OPEN_WEBUI_DATABASE_URL: "postgresql://open_webui:{{ .postgres_password }}@open-webui-postgres-rw.default.svc.cluster.local:5432/open_webui"
  data:
    - secretKey: secret_key
      remoteRef:
        key: xxx-open-webui
        property: password
    - secretKey: postgres_password
      remoteRef:
        key: xxx-open-webui-postgres
        property: password
