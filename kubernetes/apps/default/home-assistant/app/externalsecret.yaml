---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-secret
    template:
      data:
        HASS_DARKSKY_API_KEY: "{{ .darksky_api_key }}"
        HASS_ECOBEE_API_KEY: ""
        HASS_ELEVATION: "{{ .elevation }}"
        HASS_GOOGLE_PROJECT_ID: ""
        HASS_GOOGLE_SECURE_DEVICES_PIN: ""
        HASS_LATITUDE: "{{ .latitude }}"
        HASS_LONGITUDE: "{{ .longitude }}"
        HASS_PIRATE_WEATHER_API_KEY: "{{ .pirate_weather_api_key }}"
  data:
    - secretKey: darksky_api_key
      remoteRef:
        key: xxx-home-assistant
        property: darksky-api-key
    - secretKey: elevation
      remoteRef:
        key: xxx-home-assistant
        property: elevation
    - secretKey: latitude
      remoteRef:
        key: xxx-home-assistant
        property: latitude
    - secretKey: longitude
      remoteRef:
        key: xxx-home-assistant
        property: longitude
    - secretKey: pirate_weather_api_key
      remoteRef:
        key: xxx-pirate-weather
        property: credential
