---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paper
  values:
    controllers:
      paper:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          paper:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.10.1@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
            env:
              BROADCAST_RCON_TO_OPS: false
              DIFFICULTY: hard
              ENABLE_COMMAND_BLOCK: true
              ENABLE_WHITELIST: true
              EULA: true
              FORCE_GAMEMODE: true
              ICON: https://i.imgur.com/1Pzv8xx.png
              MAX_MEMORY: 8G
              MODE: survival
              MOTD: "Powered by 100% §kVOID §r energy.§r\n                     (っ◕‿◕)っ"
              OVERRIDE_ICON: true
              PAPER_BUILD: "121"
              PAUSE_WHEN_EMPTY_SECONDS: "600"
              SEED: 1691256543523180978
              SERVER_NAME: Gaia
              SPAWN_PROTECTION: 0
              TZ: America/New_York
              TYPE: PAPER
              USE_MEOWICE_FLAGS: true
              VERSION: "26.2"
              VIEW_DISTANCE: 32
            envFrom:
              - secretRef:
                  name: paper-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probeExec
                    command:
                      - mc-health
                  failureThreshold: 6
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeExec
                  failureThreshold: 6
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probeExec
                  failureThreshold: 36
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 10Gi
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: paper
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mc.hades.casa
          external-dns.alpha.kubernetes.io/target: mc-router.hades.casa
          external-dns.kubernetes.io/hostname: mc.hades.casa
          external-dns.kubernetes.io/target: mc-router.hades.casa
          mc-router.itzg.me/externalServerName: mc.hades.casa
        ports:
          minecraft:
            port: 25565
      rcon:
        controller: paper
        ports:
          rcon:
            port: 25575
            targetPort: 25575
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
