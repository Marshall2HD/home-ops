---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paper
  values:
    controllers:
      paper:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          paper:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.10.1@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
            env:
              BROADCAST_RCON_TO_OPS: false
              DIFFICULTY: hard
              ENABLE_COMMAND_BLOCK: true
              ENABLE_WHITELIST: true
              EULA: true
              FORCE_GAMEMODE: true
              ICON: https://i.imgur.com/1Pzv8xx.png
              # Sets -Xms and -Xmx together, as Aikar's flags expect
              MEMORY: 8G
              MODE: survival
              MOTD: "Powered by 100% §kVOID §r energy.§r\n                     (っ◕‿◕)っ"
              OVERRIDE_ICON: true
              PAUSE_WHEN_EMPTY_SECONDS: "600"
              SEED: 1691256543523180978
              SERVER_NAME: Gaia
              SPAWN_PROTECTION: 0
              TZ: America/New_York
              TYPE: PAPER
              # Paper's own recommended set for 26.x (fill API version.java.flags)
              USE_AIKAR_FLAGS: true
              # No PAPER_BUILD: the image takes the newest stable Paper build for VERSION
              VERSION: "26.3"
              VIEW_DISTANCE: 32
              # mc-router sends a PROXY protocol header (the patches ConfigMap turns it on
              # in Paper), so the health check has to send one too
              MC_HEALTH_EXTRA_ARGS: --use-proxy
              PATCH_DEFINITIONS: /patches
            envFrom:
              - secretRef:
                  name: paper-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probeExec
                    command:
                      - mc-health
                  failureThreshold: 6
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeExec
                  failureThreshold: 6
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probeExec
                  failureThreshold: 36
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                # AlwaysPreTouch commits the whole 8G heap at startup
                memory: 8Gi
              limits:
                memory: 10Gi
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: paper
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mc.hades.casa
          external-dns.alpha.kubernetes.io/target: mc-router.hades.casa
          external-dns.kubernetes.io/hostname: mc.hades.casa
          external-dns.kubernetes.io/target: mc-router.hades.casa
          # hades.casa: from 26.4, clients that follow the _minecraft._tcp.hades.casa SRV
          # record send the name the player typed, and mc-router routes on that
          mc-router.itzg.me/externalServerName: mc.hades.casa,hades.casa
        ports:
          minecraft:
            port: 25565
      rcon:
        controller: paper
        ports:
          rcon:
            port: 25575
            targetPort: 25575
    configMaps:
      patches:
        data:
          # Applied by the image at every start; the file lives on the data PVC
          paper.json: |-
            {
              "file": "/data/config/paper-global.yml",
              "ops": [
                { "$set": { "path": "$.proxies['proxy-protocol']", "value": true } }
              ]
            }
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      patches:
        type: configMap
        identifier: patches
        globalMounts:
          - path: /patches
            readOnly: true
      tmpfs:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
