---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paper
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paper-secret
  data:
    - secretKey: RCON_PASSWORD
      remoteRef:
        key: minecraft
        property: password
    - secretKey: WHITELIST
      remoteRef:
        key: minecraft
        property: whitelist
    - secretKey: OPS
      remoteRef:
        key: minecraft
        property: ops
