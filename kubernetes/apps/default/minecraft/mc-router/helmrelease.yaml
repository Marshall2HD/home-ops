---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mc-router
  values:
    image:
      repository: itzg/mc-router
      tag: 1.52.0@sha256:7c71e11ae3ab3b10c2f6e0090c0cee5544bbbb8f8f02b83ea696b8a182d3eca0
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: 250m
        memory: 100Mi
    services:
      minecraft:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mc-router.hades.casa
          external-dns.kubernetes.io/hostname: mc-router.hades.casa
          lbipam.cilium.io/ips: 10.8.0.130
      extraServiceSpec:
        externalTrafficPolicy: Local
    minecraftRouter:
      metrics:
        backend: prometheus
