---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mc-router
  values:
    image:
      repository: itzg/mc-router
      tag: 1.48.0@sha256:3a9ece070b97c8c55666810fc81cb209e1dd775fce792187e296626b786859cc
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: 250m
        memory: 100Mi
    services:
      minecraft:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mc-router.hades.casa
          external-dns.kubernetes.io/hostname: mc-router.hades.casa
          lbipam.cilium.io/ips: 10.8.0.130
      extraServiceSpec:
        externalTrafficPolicy: Local
    minecraftRouter:
      metrics:
        backend: prometheus
