---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mc-router
  values:
    image:
      repository: docker.io/itzg/mc-router
      tag: 1.55.0@sha256:0e89cb4e8e1e73f9ccec4211fab5c6b8336bd2768b82b7cca25c6290ed5a2f4a
      # The chart defaults to Always
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: 250m
        memory: 100Mi
    services:
      minecraft:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mc-router.hades.casa
          external-dns.kubernetes.io/hostname: mc-router.hades.casa
          lbipam.cilium.io/ips: 10.8.0.130
      extraServiceSpec:
        externalTrafficPolicy: Local
    extraEnv:
      # Paper is the only backend; don't watch Services cluster-wide
      KUBE_NAMESPACE: default
      # Player login log lines and Prometheus metrics
      RECORD_LOGINS: "true"
      TZ: America/New_York
    minecraftRouter:
      # One token bucket for all clients (burst 2x), taken before the handshake, so
      # internet scanners share it with players; a join is two connections (ping, login)
      connectionRateLimit: 5
      metrics:
        backend: prometheus
