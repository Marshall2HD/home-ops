---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mc-router
  values:
    image:
      repository: docker.io/itzg/mc-router
      tag: 1.56.0@sha256:75aa00d729ff73ca004cd482ce6272d4f4f662aa4a1192333a14a50449eceeda
      # The chart defaults to Always
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: 250m
        memory: 100Mi
    services:
      minecraft:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mc-router.hades.casa
          external-dns.kubernetes.io/hostname: mc-router.hades.casa
          lbipam.cilium.io/ips: 10.8.0.130
      extraServiceSpec:
        externalTrafficPolicy: Local
    extraEnv:
      # Paper is the only backend; don't watch Services cluster-wide
      KUBE_NAMESPACE: default
      # Player login log lines and Prometheus metrics
      RECORD_LOGINS: "true"
      TZ: America/New_York
    minecraftRouter:
      # One token bucket for all clients (burst 2x), taken before each accept. It delays
      # new connections instead of dropping them, so it is only a ceiling on floods; the
      # real peak is about 2/s and a join is two connections (ping, login)
      connectionRateLimit: 30
      # PROXY protocol v2 to Paper, so Paper sees each player's real IP for its login
      # throttle, logs and bans (Paper has proxies.proxy-protocol on to match)
      useProxyProtocol: true
      metrics:
        backend: prometheus
  # Public traffic reaches mc-router only through Hades (mc.hades.casa): Hades DNATs
  # 25565/tcp to 10.254.66.3 and fd10:254:66::3 without SNAT, so mc-router sees real
  # client IPs. As for TeamSpeak, the init container puts those addresses on a WireGuard
  # link to Hades in the pod's network namespace and sends only traffic from them
  # (replies to players) back through Hades. Everything else, LAN players on 10.8.0.130
  # included, uses eth0. The chart has no init container values, hence the post-render patch.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: mc-router
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: mc-router
                annotations:
                  reloader.stakater.com/auto: "true"
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wireguard
                        image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls129@sha256:236f9a9a89c701bc83f6d41007157dc77361114d14e56a08e846bb4499622e97
                        command: ["/bin/sh", "-c"]
                        args:
                          - |
                            set -eu
                            ip link delete wg0 2>/dev/null || true
                            ip link add wg0 type wireguard
                            wg setconf wg0 /wireguard/wg0.conf
                            ip address add 10.254.66.3/32 dev wg0
                            ip -6 address add fd10:254:66::3/128 dev wg0
                            ip link set wg0 mtu 1420 up
                            ip route replace default dev wg0 table 66
                            ip -6 route replace default dev wg0 table 66
                            ip rule del priority 100 2>/dev/null || true
                            ip -6 rule del priority 100 2>/dev/null || true
                            ip rule add from 10.254.66.3 lookup 66 priority 100
                            ip -6 rule add from fd10:254:66::3 lookup 66 priority 100
                            ip rule
                            ip -6 rule
                        securityContext:
                          runAsUser: 0
                          runAsGroup: 0
                          runAsNonRoot: false
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                            add: ["NET_ADMIN"]
                        volumeMounts:
                          - name: wireguard
                            mountPath: /wireguard
                            readOnly: true
                    volumes:
                      - name: wireguard
                        secret:
                          secretName: mc-router-secret
