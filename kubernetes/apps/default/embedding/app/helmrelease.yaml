---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app embedding
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  timeout: 30m
  values:
    controllers:
      embedding:
        strategy: Recreate
        containers:
          app:
            image:
              # Anvil (github.com/Marshall2HD/anvil, v1.0.0-l4) is one static Rust/CUDA binary that needs only glibc and the
              # driver's libcuda, which the NVIDIA runtime injects. The repository is private and the cluster pulls only
              # public images, so the binary sits on the PVC next to the private weights (copied once, like them; the
              # release asset of the tag) and this stock image runs it. Built on Ubuntu 24.04, so the same glibc.
              repository: docker.io/library/ubuntu
              tag: 26.10@sha256:262df65c0ec6bf8d9dcc87454f4330a05fae4b97825f45854af3b136666584c2
            command:
              - /bin/bash
              - -ec
            args:
              - |
                # Our distilled voyage-4-nano (0.34B, embedding-research clean-long-s0, BF16 checkpoint), served by Anvil:
                # FP8 W8A8 GEMMs and 8-bit attention (INT8 Q·Kᵀ, FP8 P·V), quantized from the BF16 weights at start.
                # Same contract as vLLM 0.32 before it (/v1/embeddings, /v1/models, /health, /metrics; served name
                # voyage-4-nano-distill; 1024-d default output, `dimensions` honoured). Clients send the prompts themselves:
                #   query:    "Represent the query for retrieving supporting documents: "
                #   document: "Represent the document for retrieval: "
                # vLLM's manifest is the previous commit of this file (revert it to go back).
                MODEL=/models/clean-long-s0
                BIN=/models/anvil/v1.0.0-l4/anvil
                until [ -f "$MODEL/model.safetensors" ] && [ -f "$MODEL/.complete" ] && [ -f "$BIN" ]; do
                  echo "waiting for $MODEL and $BIN"; sleep 10
                done
                echo "7fa898fa4a71e1502211001a44b99a07829bf88ae72ada0f27fe2310fb6cddc2  $BIN" | sha256sum -c -
                exec "$BIN" serve "$MODEL" --host 0.0.0.0 --port 8000 --served-model-name voyage-4-nano-distill
            env:
              TZ: America/New_York
              NVIDIA_DRIVER_CAPABILITIES: compute,utility
              NVIDIA_VISIBLE_DEVICES: all
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # The first start waits for the weights to be copied in.
                  failureThreshold: 360
            resources:
              requests:
                cpu: 1
                memory: 3Gi
                nvidia.com/gpu: 1
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
    defaultPodOptions:
      runtimeClassName: nvidia
      nodeSelector:
        node.kubernetes.io/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    persistence:
      models:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /models
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hades.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
