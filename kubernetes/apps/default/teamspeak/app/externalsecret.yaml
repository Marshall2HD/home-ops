---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teamspeak
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: teamspeak-secret
    template:
      data:
        # Read by `wg setconf`, so no Address line: the init container sets the address.
        wg0.conf: |
          [Interface]
          PrivateKey = {{ .private_key }}

          [Peer]
          PublicKey = {{ .peer_public_key }}
          Endpoint = {{ .peer_endpoint }}
          AllowedIPs = 0.0.0.0/0, ::/0
          PersistentKeepalive = 25
  data:
    - secretKey: private_key
      remoteRef:
        key: xxx-wireguard
        property: teamspeak-private-key
    - secretKey: peer_public_key
      remoteRef:
        key: xxx-wireguard
        property: peer-public-key
    - secretKey: peer_endpoint
      remoteRef:
        key: xxx-wireguard
        property: peer-endpoint
