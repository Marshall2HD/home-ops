---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teamspeak
spec:
  chartRef:
    kind: OCIRepository
    name: teamspeak
  interval: 1h
  values:
    controllers:
      teamspeak:
        # One WireGuard key and one RWO volume: never run two pods at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Public traffic reaches TeamSpeak only through Hades (teamspeak.falkerie.com):
          # Hades DNATs 9987/udp and 30033/tcp to 10.254.66.2 and fd10:254:66::2 without
          # SNAT, so the server sees real client IPs. This puts those addresses on a
          # WireGuard link to Hades in the pod's network namespace, which outlives this
          # container, and sends only traffic from them (replies to players) back through
          # Hades. Everything else, TeamSpeak's own internet traffic included, uses eth0.
          wireguard:
            image:
              repository: lscr.io/linuxserver/wireguard
              tag: 1.0.20260223-r0-ls129@sha256:236f9a9a89c701bc83f6d41007157dc77361114d14e56a08e846bb4499622e97
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                ip link delete wg0 2>/dev/null || true
                ip link add wg0 type wireguard
                wg setconf wg0 /wireguard/wg0.conf
                ip address add 10.254.66.2/32 dev wg0
                ip -6 address add fd10:254:66::2/128 dev wg0
                ip link set wg0 mtu 1420 up
                ip route replace default dev wg0 table 66
                ip -6 route replace default dev wg0 table 66
                ip rule del priority 100 2>/dev/null || true
                ip -6 rule del priority 100 2>/dev/null || true
                ip rule add from 10.254.66.2 lookup 66 priority 100
                ip -6 rule add from fd10:254:66::2 lookup 66 priority 100
                ip rule
                ip -6 rule
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"], add: ["NET_ADMIN"] }
        containers:
          app:
            image:
              repository: docker.io/teamspeaksystems/teamspeak6-server
              tag: 6.0.0-beta13.1@sha256:d845f803aecf842c2df034c959c23ff2462357bacafb3807500885c5ec170fa1
            # Voice binds only to the tunnel addresses, so its UDP replies leave from them
            # and take the tunnel; bound to 0.0.0.0 they would leave from eth0's address.
            # TSSERVER_VOICE_IP takes a single address, hence the flags.
            command: ["tsserver", "--voice-ip", "10.254.66.2", "--voice-ip", "fd10:254:66::2"]
            env:
              TSSERVER_LICENSE_ACCEPTED: accept
              TZ: America/New_York
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 30033
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9987
        runAsGroup: 9987
        fsGroup: 9987
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          teamspeak:
            app:
              - path: /var/tsserver
      wireguard:
        type: secret
        name: teamspeak-secret
        advancedMounts:
          teamspeak:
            wireguard:
              - path: /wireguard
                readOnly: true
