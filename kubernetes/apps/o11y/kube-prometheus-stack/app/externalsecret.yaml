---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      data:
        BUDDY_HEARTBEAT_TOKEN: "{{ .heartbeat_token }}"
        BUDDY_HEARTBEAT_URL: "https://{{ .status_hostname }}/api/v1/endpoints/buddy_heartbeat/external?success=true"
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .pushover_token }}"
        PUSHOVER_USER_KEY: "{{ .pushover_user_key }}"
  data:
    - secretKey: heartbeat_token
      remoteRef:
        key: xxx-buddy
        property: credential
    - secretKey: status_hostname
      remoteRef:
        key: xxx-buddy
        property: hostname
    - secretKey: pushover_token
      remoteRef:
        key: xxx-pushover
        property: alertmanager
    - secretKey: pushover_user_key
      remoteRef:
        key: xxx-pushover
        property: credential
