---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-sidecar
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-sidecar-secret
  data:
    - secretKey: BUDDY_DDNS_HOSTNAME
      remoteRef:
        key: buddy
        property: ddns-hostname
    - secretKey: BUDDY_HEARTBEAT_TOKEN
      remoteRef:
        key: buddy
        property: credential
    - secretKey: BUDDY_PUSHOVER_TOKEN
      remoteRef:
        key: pushover
        property: gatus
    - secretKey: BUDDY_PUSHOVER_USER_KEY
      remoteRef:
        key: pushover
        property: credential
    - secretKey: BUDDY_STATUS_HOSTNAME
      remoteRef:
        key: buddy
        property: hostname
